<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Illustration of the Screen Explainer workflow: press Ctrl+Shift+A, drag a box around something on screen, and an explanation appears in a floating window">
